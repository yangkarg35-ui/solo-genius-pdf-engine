<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solo Genius AI Intelligence Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #050505; color: #d1d1d1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; }
        h2 { color: #d4af37; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 30px; }
        label { display: block; color: #d4af37; font-size: 12px; margin: 15px 0 5px 0; letter-spacing: 1px; text-transform: uppercase; }
        textarea { width: 100%; background: #000000; color: #ffffff; border: 1px solid #2a2a2a; padding: 15px; box-sizing: border-box; font-family: inherit; line-height: 1.6; }
        textarea:focus { outline: none; border-color: #d4af37; }
        .btn { background: #d4af37; color: #050505; font-weight: bold; padding: 12px 20px; border: none; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-outline { background: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 12px 20px; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .section { margin-bottom: 40px; border-bottom: 1px solid #1a1a1a; padding-bottom: 30px; }
        
        #pdf-export { display: none; width: 210mm; padding: 25mm 20mm; background-color: #050505; color: #e0e0e0; font-family: sans-serif; }
        .gold-box { border-left: 4px solid #d4af37; background: #0c0f14; padding: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Solo Genius Intelligence Portal</h2>

    <!-- 1. AI Q&A Section -->
    <div class="section">
        <label>Ask AI (Solo Genius Intelligence):</label>
        <textarea id="aiQuestion" placeholder="Enter inquiry..."></textarea>
        <button class="btn" onclick="askAI()">Generate Answer</button>
        <label>AI Answer Output:</label>
        <textarea id="aiAnswer" readonly></textarea>
    </div>

    <!-- 2. PDF Editor Section -->
    <div class="section">
        <label>PDF Content Editor (Manual):</label>
        <textarea id="pdfContent" placeholder="Enter final content to be exported as PDF..."></textarea>
        <button class="btn-outline" onclick="generatePDF()">Export Luxury PDF</button>
    </div>
</div>

<!-- Export Template -->
<div id="pdf-export">
    <div style="color: #d4af37; margin-bottom: 20px;">SOLO GENIUS MUSICAL SCHOOL</div>
    <div class="gold-box" id="dynamic-content"></div>
</div>

<script>
    const part1 = "gsk_6tt3ppqiuw5tVseD";
    const part2 = "Sb8KWGdyb3FYYyS8I3bfbp53SPd7xfaWW8Dt";
    const GROQ_API_KEY = part1 + part2;

    async function askAI() {
        const question = document.getElementById('aiQuestion').value;
        const answerBox = document.getElementById('aiAnswer');
        
        try {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: "Solo Genius System: Provide elite, direct, architectural answers with 5% hidden truths." }, { role: "user", content: question }]
                })
            });
            const data = await res.json();
            answerBox.value = data.choices[0].message.content;
        } catch(e) { alert("Error connecting to system."); }
    }

    function generatePDF() {
        const content = document.getElementById('pdfContent').value;
        const dynamicDiv = document.getElementById('dynamic-content');
        dynamicDiv.innerText = content;
        
        const container = document.getElementById('pdf-export');
        container.style.display = 'block';
        
        html2pdf().from(container).save('Solo_Genius_PDF.pdf').then(() => {
            container.style.display = 'none';
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLO GENIUS AI INTELLIGENCE PORTAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: #0c0f14;
            --border-color: #2a2a2a;
            --gold: #d4af37;
            --gold-hover: #e6c547;
            --text-main: #d1d1d1;
            --text-bright: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container { max-width: 950px; margin: 0 auto; }
        .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 30px; }
        h2 { color: var(--gold); letter-spacing: 3px; font-size: 18px; text-transform: uppercase; margin: 0; }
        .system-status { font-size: 11px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .panel-title { color: var(--gold); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
        textarea { width: 100%; height: 180px; background: #000000; color: var(--text-bright); border: 1px solid var(--border-color); padding: 15px; box-sizing: border-box; font-family: inherit; font-size: 14px; line-height: 1.6; resize: vertical; }
        textarea:focus { outline: none; border-color: var(--gold); }
        .btn-group { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        button { background: var(--gold); color: var(--bg-color); font-weight: bold; font-size: 12px; padding: 12px 24px; border: none; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; transition: all 0.2s ease; }
        button:hover { background: var(--gold-hover); }
        .btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
        .output-box { background: #000000; border: 1px solid var(--border-color); border-left: 3px solid var(--gold); padding: 25px; margin-top: 20px; color: var(--text-bright); font-size: 14px; line-height: 1.8; white-space: pre-wrap; display: none; }
        .loading-state { color: var(--gold); font-style: italic; font-size: 13px; margin-top: 15px; display: none; }
        .error-banner { background: rgba(255, 0, 0, 0.1); border: 1px solid #ff4444; color: #ff8888; padding: 12px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <h2>Solo Genius AI Intelligence Portal</h2>
        <div class="system-status">Engine: OpenAI GPT-4o &bull; Protocol: Public Intelligence Standard</div>
    </div>

    <div class="panel">
        <div class="panel-title">Intelligence & Extraction Engine</div>
        <textarea id="userQuestion" placeholder="မေးခွန်း သို့မဟုတ် ခွဲခြမ်းစိတ်ဖြာရန် အချက်အလက်များ ထည့်သွင်းပါ..."></textarea>
        <div class="btn-group">
            <button id="generateBtn" onclick="processRequest()">Run Intelligence Protocol</button>
        </div>
        <div id="loadingStatus" class="loading-state">Processing via Public Intelligence Standard...</div>
        <div id="errorBanner" class="error-banner"></div>
        <div id="answerPreview" class="output-box"></div>
    </div>
</div>

<script>
    const API_KEY = "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";

    async function processRequest() {
        const input = document.getElementById('userQuestion').value.trim();
        const status = document.getElementById('loadingStatus');
        const output = document.getElementById('answerPreview');
        const err = document.getElementById('errorBanner');
        const btn = document.getElementById('generateBtn');

        if (!input) return;

        status.style.display = 'block';
        err.style.display = 'none';
        output.style.display = 'none';
        btn.disabled = true;

        const systemPrompt = `[PUBLIC INTELLIGENCE STANDARD - UNIVERSAL HIGH-LEVEL ANSWER SYSTEM]
You are an advanced public-facing AI assistant. Your purpose is to provide the highest-quality reasoning and communication possible for any member of the public.
CORE IDENTITY: You are a rigorous thinker, systems thinker, strategic advisor, clear educator, practical problem solver, and intellectually honest assistant.
OPERATIONAL PRINCIPLES:
1. Useful Truth over Pleasant Agreement.
2. Respectfully challenge weak assumptions.
3. Improve framing before answering.
4. Distinguish clearly between KNOWN facts, INFERENCE, UNCERTAIN evidence, and SPECULATION.
5. Never fabricate statistics, studies, or sources.
6. Use Second-Order Thinking for important decisions.
REASONING PROTOCOL:
- UNDERSTAND: Identify the underlying decision or problem.
- DECONSTRUCT: Break down into components (Facts, Assumptions, Constraints).
- FIND THE CORE: Focus on high-leverage variables.
- REASON FROM FIRST PRINCIPLES: Explain the mechanism, not just the result.
- THINK IN SYSTEMS: Consider feedback loops, incentives, and second-order effects.
- MAKE IT ACTIONABLE: Convert insights into practical steps.
COMMUNICATION STYLE:
- Be calm, precise, intelligent, direct, and modern.
- Avoid excessive emojis, empty praise, corporate jargon, and performance-based language.
- Start with substance. 
- Use the user's natural language (Burmese/English).
- When teaching, use the pattern: Concept -> Mechanism -> Example -> Application.
FINAL GOAL: Do not aim to sound intelligent. Aim to make the user's thinking better by providing clearer understanding, better mental models, or practical next steps.`;

        try {
            const res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: input }
                    ],
                    temperature: 0.3
                })
            });
            const data = await res.json();
            if (data.error) {
                throw new Error(data.error.message);
            }
            output.innerText = data.choices[0].message.content;
            output.style.display = 'block';
        } catch (e) {
            err.innerText = "System Error: " + e.message;
            err.style.display = 'block';
        } finally {
            status.style.display = 'none';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
